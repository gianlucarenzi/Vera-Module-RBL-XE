# Photorealistic still of the enclosure (tools/render_enclosure.py): Blender
# and Cycles in a debian:latest container, the boards from their VRML, the
# shells and the back panel from enclosure/*.stl. By hand only: Actions >
# Render > Run workflow. The PNG is in the "render" artifact.
name: Render

on:
  workflow_dispatch:
    inputs:
      pose:
        description: "open (top shell lifted, panel out) or closed"
        type: choice
        options: [open, closed]
        default: open
      variant:
        description: "backpanel or open (port window)"
        type: choice
        options: [backpanel, open]
        default: backpanel
      color:
        description: "case colour, sRGB hex (E3D9C6 = RAL 1013 Oyster white)"
        default: E3D9C6
      samples:
        description: "Cycles samples"
        default: "128"
      resolution:
        description: "WxH"
        default: 1920x1080

permissions:
  contents: read

env:
  HDMI_REPO: gianlucarenzi/Vera-HDMI-Expansion
  # the official build: the Debian one has no OpenImageDenoise (denoiser)
  BLENDER: blender-4.2.23-linux-x64
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz

defaults:
  run:
    shell: bash

jobs:
  render:
    runs-on: ubuntu-latest
    container: debian:latest
    timeout-minutes: 120
    steps:
      - name: Packages (Git LFS, libraries of the official Blender)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git git-lfs ca-certificates curl xz-utils zstd \
            libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 \
            libgl1 libegl1 libglu1-mesa libwayland-client0 libwayland-cursor0 libwayland-egl1 libdecor-0-0

      - name: Blender (cached)
        id: blender
        uses: actions/cache@v4
        with:
          path: /opt/${{ env.BLENDER }}
          key: ${{ env.BLENDER }}

      - name: Download Blender
        if: steps.blender.outputs.cache-hit != 'true'
        run: curl -fsSL "$BLENDER_URL" | tar -xJ -C /opt

      - uses: actions/checkout@v4
        with:
          lfs: true       # images/*.wrl

      - name: VERA-HDMI-Expansion (VRML of the add-on board)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HDMI_REPO }}
          path: Vera-HDMI-Expansion
          lfs: true

      - name: Render
        env:
          HDMI_DIR: ${{ github.workspace }}/Vera-HDMI-Expansion
          RENDER_POSE: ${{ inputs.pose }}
          RENDER_VARIANT: ${{ inputs.variant }}
          RENDER_COLOR: ${{ inputs.color }}
          RENDER_SAMPLES: ${{ inputs.samples }}
          RENDER_RES: ${{ inputs.resolution }}
          RENDER_OUT: ${{ github.workspace }}/render/${{ github.event.repository.name }}-${{ inputs.variant }}-${{ inputs.pose }}.png
        run: |
          export PATH="/opt/$BLENDER:$PATH"
          blender --version | head -1
          echo "$(nproc) CPUs"
          blender -b --python-exit-code 1 -P tools/render_enclosure.py
          test -s "$RENDER_OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: render
          path: render/*.png
          if-no-files-found: error
